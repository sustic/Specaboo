<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Specaboo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Specaboo: a quiet page to type on. Everything stays in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='16 14 68 92'%3E%3Cpath d='M20 92V48a30 30 0 0 1 60 0v44a10 10 0 0 1-20 0a10 10 0 0 1-20 0a10 10 0 0 1-20 0Z' fill='%23fff' stroke='%231a1a1a' stroke-width='5' stroke-linejoin='round'/%3E%3Crect x='35' y='40' width='9' height='14' rx='4.5' fill='%231a1a1a'/%3E%3Crect x='56' y='40' width='9' height='14' rx='4.5' fill='%231a1a1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,700;1,14..32,400&display=swap">
<style>
/* Layout: one clean sheet in SwipeSpec's palette, a single writing column, and a quiet bottom bar that fades while you type. */
:root {
  --paper: #f6f6f6;        /* SwipeSpec background */
  --ink: #1a1a1a;          /* SwipeSpec text */
  --muted: #555555;        /* SwipeSpec subtitles */
  --ghost: #ffffff;
  --blush: #fb5151;        /* SwipeSpec red, softened on the cheeks */
  --accent: #36a2eb;       /* SwipeSpec link blue */
  --glow: rgba(26, 26, 26, 0.12);
  --select: rgba(54, 162, 235, 0.25);
  --chip: rgba(26, 26, 26, 0.06);
  --chip-hover: rgba(26, 26, 26, 0.11);
  --solid: #1a1a1a;        /* dark pill button */
  --on-solid: #f6f6f6;

  --f-mark: "Inter", Arial, sans-serif;
  --f-text: "Inter", Arial, sans-serif;
  --f-ui: "Inter", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1a1a; --ink: #f6f6f6; --muted: #8f8f8f; --ghost: #f6f6f6; --blush: #fb5151; --accent: #36a2eb;
    --glow: rgba(246, 246, 246, 0.14); --select: rgba(54, 162, 235, 0.35);
    --chip: rgba(246, 246, 246, 0.08); --chip-hover: rgba(246, 246, 246, 0.15);
    --solid: #f6f6f6; --on-solid: #1a1a1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1a1a; --ink: #f6f6f6; --muted: #8f8f8f; --ghost: #f6f6f6; --blush: #fb5151; --accent: #36a2eb;
  --glow: rgba(246, 246, 246, 0.14); --select: rgba(54, 162, 235, 0.35);
  --chip: rgba(246, 246, 246, 0.08); --chip-hover: rgba(246, 246, 246, 0.15);
  --solid: #f6f6f6; --on-solid: #1a1a1a;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-ui);
  transition: background-color .4s ease, color .4s ease;
  overflow: hidden;
}
::selection { background: var(--select); }

/* ---------- writing surface ---------- */
.sheet {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#page {
  width: 100%;
  max-width: 40rem;
  height: 100%;
  box-sizing: border-box;
  padding-block: clamp(3rem, 12vh, 8rem) 6.5rem;
  border: 0;
  outline: none;
  resize: none;
  background: transparent;
  color: var(--ink);
  caret-color: var(--accent);
  font-family: var(--f-text);
  font-optical-sizing: auto;
  font-size: clamp(1.0625rem, 0.95rem + 0.45vw, 1.3125rem);
  line-height: 1.7;
  letter-spacing: -0.006em;
  scrollbar-width: thin;
  scrollbar-color: var(--chip-hover) transparent;
}
#page::placeholder { color: var(--muted); opacity: .7; font-style: italic; }

/* ---------- bottom bar ---------- */
.bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--paper) 55%, transparent);
  font-size: 12px;
  color: var(--muted);
  transition: opacity .6s ease;
}
body.typing .bar { opacity: 0.12; }
body.typing .bar:hover, body.typing .bar:focus-within { opacity: 1; }

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ghost {
  width: 40px; height: 44px; flex: none;
  filter: drop-shadow(0 4px 10px var(--glow));
  cursor: pointer;
  background: none; border: 0; padding: 0;
  border-radius: 12px;
}
.ghost svg { width: 100%; height: 100%; overflow: visible; display: block; }
.ghost { color: var(--ink); }

.wordmark {
  font-family: var(--f-mark);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.status {
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color .3s ease;
}
.status.warn { color: var(--blush); }

.tools { display: flex; align-items: center; gap: 6px; flex: none; }
.count { font-variant-numeric: tabular-nums; padding-inline: 8px; white-space: nowrap; }
.btn {
  appearance: none;
  border: 0;
  background: var(--chip);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  height: 30px;
  padding: 0 11px;
  border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer;
  transition: background-color .2s ease;
}
.btn:hover { background: var(--chip-hover); }
.btn.solid { background: var(--solid); color: var(--on-solid); }
.btn.solid:hover { background: var(--accent); color: #ffffff; }
.btn:focus-visible, .ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(68px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 8px);
  background: var(--ink);
  color: var(--paper);
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  max-width: calc(100% - 32px);
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 520px) {
  .wordmark { font-size: 15px; }
  .btn .label { display: none; }
  .btn { padding: 0 9px; }
  .count .extra { display: none; }
}

/* ---------- formatting popup (WhatsApp-style markers) ---------- */
.fmt {
  position: fixed;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  max-width: calc(100vw - 16px);
  gap: 2px;
  padding: 4px;
  background: var(--solid);
  color: var(--on-solid);
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
  transform: translate(-50%, -100%);
  transition: opacity .12s ease;
}
.fmt::after {
  content: "";
  position: absolute;
  left: 50%; bottom: -5px;
  width: 10px; height: 10px;
  background: var(--solid);
  transform: translateX(-50%) rotate(45deg);
  border-radius: 2px;
}
.fmt.below { transform: translate(-50%, 0); }
.fmt.below::after { bottom: auto; top: -5px; }
.fmt button {
  appearance: none; border: 0; background: transparent; color: inherit;
  width: 34px; height: 32px; border-radius: 8px; cursor: pointer;
  display: grid; place-items: center;
  font: 15px var(--f-ui); position: relative; z-index: 1;
}
.fmt button:hover { background: rgba(127, 127, 127, .25); }
.fmt button[aria-pressed="true"] { color: var(--accent); }
.fmt button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.fmt .b { font-weight: 700; }
.fmt .i { font-style: italic; font-family: Georgia, serif; }
.fmt .s { text-decoration: line-through; }
.fmt .m { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
.fmt .h { font-weight: 700; font-size: 13px; }
.fmt .sep { width: 1px; margin: 6px 3px; background: currentColor; opacity: .25; }
.fmt svg { width: 18px; height: 18px; fill: currentColor; stroke: none; }
.fmt svg path { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.fmt svg text { font-family: var(--f-ui); }
.mirror { position: absolute; top: 0; left: -9999px; visibility: hidden; white-space: pre-wrap; overflow-wrap: break-word; }

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
@keyframes boo { 0% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-8px) rotate(-8deg); } 60% { transform: translateY(-3px) rotate(6deg); } 100% { transform: translateY(0) rotate(0); } }

@media (prefers-reduced-motion: reduce) {
  .ghost, .ghost.boo { animation: none; }
  body, .bar, .toast { transition: none; }
}
</style>

<main class="sheet">
  <textarea id="page" spellcheck="true" autofocus aria-label="Your page"
    placeholder="Start typing. Specaboo keeps this page safe in your browser, even if you close the tab."></textarea>
</main>

<footer class="bar">
  <div class="brand">
    <button class="ghost" id="ghost" type="button" aria-label="Say boo">
    </button>
    <div style="display:flex;flex-direction:column;min-width:0;line-height:1.25">
      <span class="wordmark">Specaboo</span>
      <span class="status" id="status" aria-live="polite">Ready when you are</span>
    </div>
  </div>
  <div class="tools">
    <span class="count" id="count">0 words<span class="extra"></span></span>
    <button class="btn" id="theme" type="button" aria-label="Switch to dark mode">
      <svg viewBox="0 0 24 24" id="themeIcon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <span class="label" id="themeLabel">Dark</span>
    </button>
    <button class="btn solid" id="download" type="button" aria-label="Download as .txt">
      <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>
      <span class="label">.txt</span>
    </button>
  </div>
</footer>

<div class="fmt" id="fmt" role="toolbar" aria-label="Format selected text" hidden>
  <button type="button" class="b" data-mark="*" title="Bold (Ctrl+B)" aria-label="Bold">B</button>
  <button type="button" class="i" data-mark="_" title="Italic (Ctrl+I)" aria-label="Italic">I</button>
  <button type="button" class="s" data-mark="~" title="Strikethrough (Ctrl+Shift+X)" aria-label="Strikethrough">S</button>
  <button type="button" class="m" data-mark="```" title="Code (Ctrl+Shift+M)" aria-label="Code">&lt;/&gt;</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" class="h" data-line="h1" title="Heading 1 (Ctrl+Alt+1)" aria-label="Heading 1">H1</button>
  <button type="button" class="h" data-line="h2" title="Heading 2 (Ctrl+Alt+2)" aria-label="Heading 2">H2</button>
  <button type="button" class="h" data-line="h3" title="Heading 3 (Ctrl+Alt+3)" aria-label="Heading 3">H3</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-line="ul" title="Bullet list (Ctrl+Shift+8)" aria-label="Bullet list"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="5" r="1.6"/><circle cx="4" cy="10" r="1.6"/><circle cx="4" cy="15" r="1.6"/><path d="M8 5h9M8 10h9M8 15h9"/></svg></button>
  <button type="button" data-line="ol" title="Numbered list (Ctrl+Shift+7)" aria-label="Numbered list"><svg viewBox="0 0 20 20" aria-hidden="true"><text x="1.5" y="7" font-size="6" font-weight="700">1</text><text x="1.5" y="12.5" font-size="6" font-weight="700">2</text><text x="1.5" y="18" font-size="6" font-weight="700">3</text><path d="M8 5h9M8 10h9M8 15h9"/></svg></button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// Specaboo ghost kit: draws the Geometric ghost with any expression.
// White body, dark outline and dark features in every theme. Floating text extras use currentColor.
const GhostKit = (() => {
  const RED = "var(--gk-red, #fb5151)", BLUE = "var(--gk-blue, #36a2eb)", GREEN = "var(--gk-green, #4cc07c)";
  // The ghost itself never changes with the theme: white sheet, dark outline.
  const INK = "var(--gk-ink, #1a1a1a)", WHITE = "var(--gk-body, #ffffff)";
  const FRONT = new Set(["face", "peek", "cheeks", "mouth", "think", "cross", "facepalm", "heart", "clap", "typing", "pray", "rub"]);
  const BODY = "M20 92V48a30 30 0 0 1 60 0v44a10 10 0 0 1-20 0a10 10 0 0 1-20 0a10 10 0 0 1-20 0Z";
  const EL = [39.5, 47], ER = [60.5, 47];
  let uid = 0;

  // ---- eyes: return [maskMarkup (black = hole, white = solid), topMarkup (coloured)] ----
  const S = (d, w = 3.4) => `<path d="${d}" fill="none" stroke="#000" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  function eye(type, cx, cy, side) {
    const o = cx + side * 4.5, i = cx - side * 4.5; // outer / inner x
    switch (type) {
      case "open":   return [`<rect x="${cx-4.5}" y="${cy-7}" width="9" height="14" rx="4.5"/>`, ""];
      case "small":  return [`<circle cx="${cx}" cy="${cy}" r="3.4"/>`, ""];
      case "tiny":   return [`<circle cx="${cx}" cy="${cy+1}" r="2.2"/>`, ""];
      case "wide":   return [`<rect x="${cx-5.5}" y="${cy-9}" width="11" height="18" rx="5.5"/>`, ""];
      case "happy":  return [S(`M${cx-5} ${cy+2}Q${cx} ${cy-6} ${cx+5} ${cy+2}`), ""];
      case "down":   return [S(`M${cx-5} ${cy-1}Q${cx} ${cy+5} ${cx+5} ${cy-1}`), ""];
      case "shut":   return [S(`M${cx-5} ${cy+1}H${cx+5}`), ""];
      case "half":   return [`<path d="M${cx-4.5} ${cy}H${cx+4.5}V${cy+3}a4.5 4.5 0 0 1-9 0Z"/>`, ""];
      case "glare":  return [`<rect x="${cx-5.5}" y="${cy-1}" width="11" height="4.5" rx="2.2"/>`, ""];
      case "angry":  return [`<path d="M${o} ${cy-7}L${i} ${cy-2}V${cy+3}Q${i} ${cy+7} ${cx} ${cy+7}Q${o} ${cy+7} ${o} ${cy+3}Z"/>`, ""];
      case "sad":    return [`<path d="M${i} ${cy-7}L${o} ${cy-2}V${cy+3}Q${o} ${cy+7} ${cx} ${cy+7}Q${i} ${cy+7} ${i} ${cy+3}Z"/>`, ""];
      case "chev":   return [S(`M${cx+side*4} ${cy-5}L${cx-side*4} ${cy}L${cx+side*4} ${cy+5}`), ""];
      case "x":      return [S(`M${cx-4} ${cy-4}L${cx+4} ${cy+4}M${cx+4} ${cy-4}L${cx-4} ${cy+4}`), ""];
      case "ring":   return [`<circle cx="${cx}" cy="${cy}" r="5.6" fill="none" stroke="#000" stroke-width="3"/>`, ""];
      case "spiral": return [S(`M${cx} ${cy}m0 0a1.5 1.5 0 0 1 3 0a3 3 0 0 1-6 0a4.5 4.5 0 0 1 9 0`, 2.2), ""];
      case "sparkle":return [`<circle cx="${cx}" cy="${cy}" r="6.2"/><circle cx="${cx+2.2}" cy="${cy-2.2}" r="2" fill="#fff"/><circle cx="${cx-2}" cy="${cy+2.6}" r="1" fill="#fff"/>`, ""];
      case "lookL":  return [`<rect x="${cx-7}" y="${cy-6}" width="9" height="13" rx="4.5"/>`, ""];
      case "lookR":  return [`<rect x="${cx-2}" y="${cy-6}" width="9" height="13" rx="4.5"/>`, ""];
      case "lookU":  return [`<rect x="${cx-4.5}" y="${cy-10}" width="9" height="13" rx="4.5"/>`, ""];
      case "lookD":  return [`<rect x="${cx-4.5}" y="${cy-3}" width="9" height="12" rx="4.5"/>`, ""];
      case "heart":  return ["", heartPath(cx, cy + 1, 7.5, RED)];
      case "star":   return ["", starPath(cx, cy, 7.5, BLUE)];
      case "shades": return ["", ""];
      default: return ["", ""];
    }
  }

  // ---- mouths (mask, black = hole) and coloured tops ----
  function mouth(type) {
    const F = d => `<path d="${d}"/>`;
    switch (type) {
      case "smile":  return [S("M43 64Q50 71 57 64"), ""];
      case "grin":   return [F("M41 62H59Q58 74 50 74Q42 74 41 62Z"), ""];
      case "big":    return [F("M38 60H62Q60 79 50 79Q40 79 38 60Z"), ""];
      case "frown":  return [S("M43 70Q50 63 57 70"), ""];
      case "flat":   return [S("M44 67H56"), ""];
      case "o":      return [`<ellipse cx="50" cy="67" rx="3" ry="3.6"/>`, ""];
      case "O":      return [`<ellipse cx="50" cy="68" rx="6" ry="7.5"/>`, ""];
      case "yawn":   return [`<ellipse cx="50" cy="69" rx="5.5" ry="9"/>`, ""];
      case "wavy":   return [S("M41 67q2.25-3 4.5 0t4.5 0t4.5 0t4.5 0", 3), ""];
      case "smirk":  return [S("M44 67Q52 69 57 62"), ""];
      case "cat":    return [S("M42 64q4 5 8 0q4 5 8 0", 3), ""];
      case "teeth":  return [`<rect x="39" y="61" width="22" height="11" rx="3.5"/><path d="M39 66.5H61M45.5 61V72M50 61V72M54.5 61V72" stroke="#fff" stroke-width="1.6"/>`, ""];
      case "sadO":   return [F("M41 74Q42 62 50 62Q58 62 59 74Z"), ""];
      case "tiny":   return [`<circle cx="50" cy="66" r="1.8"/>`, ""];
      case "kiss":   return [S("M48 61q6 2 0 5q6 2 0 5", 3), ""];
      case "pout":   return [S("M45 69Q50 65 55 69", 3), ""];
      case "tongue": return [S("M42 63Q50 70 58 63"), `<path d="M50 66.5h5v4a2.5 2.5 0 0 1-5 0Z" fill="${RED}"/>`];
      case "lol":    return [F("M41 62H59Q58 74 50 74Q42 74 41 62Z"), `<path d="M44 71Q50 66 56 71Q53 74 50 74Q47 74 44 71Z" fill="${RED}"/>`];
      case "none":   return ["", ""];
      default: return ["", ""];
    }
  }

  // ---- arms: polylines from the shoulder, [left, right] ----
  const D = { L: [24, 64, 12, 80], R: [76, 64, 88, 80] };
  const ARMS = {
    down: [D.L, D.R],
    out: [[24, 63, 6, 60], [76, 63, 94, 60]],
    up: [[24, 62, 9, 38], [76, 62, 91, 38]],
    wave: [D.L, [76, 62, 93, 40]],
    hips: [[24, 62, 9, 70, 19, 80], [76, 62, 91, 70, 81, 80]],
    face: [[22, 74, 40, 49], [78, 74, 60, 49]],
    peek: [[22, 74, 40, 49], D.R],
    cheeks: [[21, 74, 29, 63], [79, 74, 71, 63]],
    mouth: [D.L, [79, 78, 54, 68]],
    shrug: [[24, 64, 9, 67, 7, 52], [76, 64, 91, 67, 93, 52]],
    point: [D.L, [76, 62, 99, 55]],
    pointUp: [D.L, [76, 62, 88, 52, 88, 30]],
    think: [D.L, [80, 80, 60, 80, 56, 74]],
    cross: [[21, 66, 63, 78], [79, 66, 37, 78]],
    facepalm: [D.L, [80, 72, 60, 54, 50, 40]],
    salute: [D.L, [76, 62, 86, 46, 70, 33]],
    heart: [[22, 68, 44, 79], [78, 68, 56, 79]],
    flex: [[24, 64, 7, 58, 11, 42], [76, 64, 93, 58, 89, 42]],
    raise: [D.L, [76, 62, 89, 30]],
    clap: [[21, 68, 47, 76], [79, 68, 53, 76]],
    scratch: [D.L, [76, 62, 92, 40, 76, 20]],
    hug: [[24, 62, 5, 50], [76, 62, 95, 50]],
    typing: [[22, 70, 33, 87], [78, 70, 67, 87]],
    pencil: [D.L, [76, 64, 90, 58]],
    pray: [[21, 70, 48, 62], [79, 70, 52, 62]],
    dance: [[24, 62, 8, 46], [76, 64, 93, 70]],
    zombie: [[24, 60, 4, 56], [76, 60, 96, 56]],
    rub: [[21, 72, 48, 70], [79, 72, 52, 72]],
    none: [[], []],
  };
  const armPath = p => p.length ? "M" + p.join(" ").replace(/(\S+ \S+) /g, "$1L").replace(/L$/, "") : "";

  // ---- extras (coloured or ink) ----
  function heartPath(x, y, s, fill) {
    const k = s / 10;
    return `<path transform="translate(${x} ${y}) scale(${k})" d="M0 8C-9 2-10-4-6-7C-3-9 0-7 0-4C0-7 3-9 6-7C10-4 9 2 0 8Z" fill="${fill}"/>`;
  }
  function starPath(x, y, r, fill) {
    const p = [];
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; p.push((x + rr * Math.cos(a)).toFixed(1) + "," + (y + rr * Math.sin(a)).toFixed(1)); }
    return `<polygon points="${p.join(" ")}" fill="${fill}" stroke="${fill}" stroke-width="1" stroke-linejoin="round"/>`;
  }
  const twinkle = (x, y, s, fill) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0-5L1.3-1.3L5 0L1.3 1.3L0 5L-1.3 1.3L-5 0L-1.3-1.3Z" fill="${fill}"/>`;
  const drop = (x, y, s, fill) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0-6C2 -2 4 0 4 2.5A4 4 0 0 1-4 2.5C-4 0-2-2 0-6Z" fill="${fill}"/>`;
  const txt = (x, y, t, size, fill = "currentColor", w = 700) => `<text x="${x}" y="${y}" font-family="Inter, Arial, sans-serif" font-weight="${w}" font-size="${size}" fill="${fill}" text-anchor="middle">${t}</text>`;
  const line = (d, c = "currentColor", w = 2.6) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

  // Each extra returns a list of parts; every part is wrapped in its own <g> so it can animate.
  const EXTRAS = {
    blush: () => [`<ellipse cx="30" cy="58" rx="5" ry="3" fill="${RED}" opacity=".7"/>`, `<ellipse cx="70" cy="58" rx="5" ry="3" fill="${RED}" opacity=".7"/>`],
    tear: () => [drop(34, 60, .8, BLUE)],
    tears: () => [`<path d="M36 54v26a3 3 0 0 0 6 0V54Z" fill="${BLUE}" opacity=".9"/>`, `<path d="M58 54v26a3 3 0 0 0 6 0V54Z" fill="${BLUE}" opacity=".9"/>`],
    joy: () => [drop(28, 44, .7, BLUE), drop(72, 44, .7, BLUE)],
    sweat: () => [drop(82, 26, 1.1, BLUE)],
    hearts: () => [heartPath(12, 22, 7, RED), heartPath(88, 16, 9, RED), heartPath(92, 36, 5, RED)],
    heart: () => [heartPath(84, 14, 10, RED)],
    heartChest: () => [heartPath(50, 80, 9, RED)],
    broken: () => [`<path transform="translate(84 16)" d="M0 8C-9 2-10-4-6-7C-3-9 0-7 0-4L-2 0L1 3Z" fill="${RED}"/>`, `<path transform="translate(86 17) rotate(10)" d="M1.5 8.5C10 2 10.5-4 6.5-7C3.5-9 1-7 1-4.5L-.5 0L2.5 3Z" fill="${RED}"/>`],
    sparkles: () => [twinkle(10, 26, 1.1, BLUE), twinkle(90, 20, 1.4, BLUE), twinkle(88, 94, .9, BLUE)],
    anger: () => [`<g transform="translate(80 22)" stroke="${RED}" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M-6-2q4 0 4-4M2-6q0 4 4 4M6 2q-4 0-4 4M-2 6q0-4-4-4"/></g>`],
    zzz: () => [txt(84, 22, "z", 11), txt(92, 10, "Z", 15)],
    question: () => [txt(88, 24, "?", 22)],
    exclaim: () => [txt(87, 24, "!", 24)],
    note: () => [txt(88, 26, "♪", 20), txt(10, 34, "♫", 14)],
    steam: () => [line("M14 20q-4-4 0-8t0-8"), line("M86 20q4-4 0-8t0-8")],
    idea: () => [`<g transform="translate(50 4)"><circle r="6" fill="${BLUE}"/>${line("M-11 0h-3M11 0h3M-8-8l-2-2M8-8l2-2M0-10v-3", BLUE, 2.2)}</g>`],
    dizzy: () => [line("M24 12q26-14 54 0", "currentColor", 1.4), twinkle(30, 10, .9, BLUE), twinkle(52, 4, 1.1, BLUE), twinkle(72, 10, .9, BLUE)],
    shiver: () => [line("M6 50l-4 4 4 4-4 4"), line("M94 50l4 4-4 4 4 4")],
    waves: () => [line("M96 30q4 6 2 12", BLUE), line("M90 24q8 4 10 12", BLUE)],
    motion: () => [line("M40 86l-4 6", BLUE), line("M50 88v7", BLUE), line("M60 86l4 6", BLUE)],
    dots: () => [`<circle cx="74" cy="12" r="2.6" fill="currentColor"/>`, `<circle cx="83" cy="12" r="2.6" fill="currentColor"/>`, `<circle cx="92" cy="12" r="2.6" fill="currentColor"/>`],
    cloud: () => [`<g transform="translate(50 2)" fill="currentColor" opacity=".35"><circle cx="-8" cy="2" r="6"/><circle cx="2" cy="-1" r="8"/><circle cx="11" cy="3" r="5"/><rect x="-14" y="2" width="30" height="6" rx="3"/></g>`, drop(42, 18, .5, BLUE), drop(54, 20, .5, BLUE)],
    confetti: () => [`<rect x="8" y="14" width="5" height="3" fill="${RED}" transform="rotate(30 10 15)"/>`, `<rect x="86" y="10" width="5" height="3" fill="${BLUE}" transform="rotate(-20 88 11)"/>`, `<rect x="92" y="34" width="5" height="3" fill="${GREEN}" transform="rotate(50 94 35)"/>`, `<rect x="4" y="38" width="5" height="3" fill="${BLUE}"/>`, `<circle cx="20" cy="6" r="2" fill="${GREEN}"/>`, `<circle cx="76" cy="4" r="2" fill="${RED}"/>`],
    pencil: () => [`<g transform="translate(92 54) rotate(30)"><rect x="-3" y="-20" width="6" height="22" rx="1" fill="${BLUE}"/><path d="M-3 2h6l-3 7Z" fill="currentColor"/></g>`],
    keyboard: () => [`<g><rect x="26" y="86" width="48" height="12" rx="3" fill="${BLUE}"/><path d="M31 90.5h38M31 94h38" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="3 2"/></g>`],
    paper: () => [`<g transform="translate(12 60) rotate(-10)"><rect x="-8" y="-11" width="16" height="22" rx="1.5" fill="#ffffff" stroke="currentColor" stroke-width="2"/><path d="M-4-5h8M-4 0h8M-4 5h5" stroke="${BLUE}" stroke-width="1.6"/></g>`],
    check: () => [`<g transform="translate(86 16)"><circle r="9" fill="${GREEN}"/>${line("M-4 0l3 3 5-6", "#ffffff", 2.6)}</g>`],
    fire: () => [`<path d="M86 30C78 26 78 16 84 8C84 14 88 14 88 10C94 16 94 26 86 30Z" fill="${RED}"/>`],
    shades: () => [`<g><path d="M30 42H70V47Q70 54 63 54Q57 54 56 47H44Q43 54 37 54Q30 54 30 47Z" fill="${BLUE}"/><path d="M33 44h4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/></g>`],
    smoke: () => [`<circle cx="44" cy="10" r="5" fill="currentColor" opacity=".3"/>`, `<circle cx="54" cy="6" r="6" fill="currentColor" opacity=".3"/>`, `<circle cx="62" cy="12" r="4" fill="currentColor" opacity=".3"/>`],
    wind: () => [line("M2 58h10M0 66h14M4 74h8", "currentColor", 2)],
    sick: () => [`<ellipse cx="30" cy="58" rx="6" ry="3" fill="${GREEN}" opacity=".8"/>`, `<ellipse cx="70" cy="58" rx="6" ry="3" fill="${GREEN}" opacity=".8"/>`],
    halo: () => [`<ellipse cx="50" cy="8" rx="16" ry="4" fill="none" stroke="${BLUE}" stroke-width="3"/>`],
    horns: () => [`<path d="M30 26L24 10L38 20Z M70 26L76 10L62 20Z" fill="${RED}"/>`],
    crown: () => [`<path d="M36 18L34 4L43 11L50 2L57 11L66 4L64 18Z" fill="${BLUE}"/>`],
    party: () => [`<g><path d="M42 19L52 -6L62 19Z" fill="${BLUE}"/><circle cx="52" cy="-6" r="3" fill="${RED}"/></g>`],
  };

  // ---- motion: which loop each part plays ----
  const ARM_MOTION = {
    wave: ["swing", "wave"], up: ["flap", "flap"], flex: ["flap", "flap"], raise: ["swing", "flap"], pointUp: ["swing", "flap"],
    clap: ["clap", "clap"], heart: ["clap", "clap"], pray: ["clap", "clap"], rub: ["clap", "clap"],
    typing: ["tap", "tap2"], shrug: ["shrug", "shrug"], hug: ["flap", "flap"], out: ["flap", "flap"],
    scratch: ["swing", "scratch"], facepalm: ["swing", "scratch"], zombie: ["reach", "reach"], dance: ["flap", "flap2"],
    pencil: ["swing", "scratch"], salute: ["swing", "swing"], point: ["swing", "swing"],
  };
  const EYE_MOTION = { open: "blink", small: "blink", tiny: "blink", wide: "blink", glare: "blink", angry: "blink", sad: "blink", half: "blink",
    lookL: "blink", lookR: "blink", lookU: "blink", lookD: "blink", sparkle: "shimmer", heart: "beat", star: "spin", spiral: "spin", ring: "beat" };
  const MOUTH_MOTION = { O: "oh", o: "oh", yawn: "oh", lol: "chatter", big: "chatter", wavy: "jitter", teeth: "jitter", kiss: "pucker", tongue: "pucker", cat: "pucker" };

  // spec: {eyes:"open" | "open|happy", mouth, arms, extras:"a b", tilt, squash:[sx,sy], dy, fade, motion, d}
  function svg(spec, opts = {}) {
    const [eL, eR = eL] = (spec.eyes || "open").split("|");
    const pose = spec.arms || "down";
    const left = eye(eL, EL[0], EL[1], -1), right = eye(eR, ER[0], ER[1], 1);
    const m = mouth(spec.mouth || "none");
    const front = FRONT.has(pose);
    const ink = str => str.replace(/#000/g, INK).replace(/#fff\b/g, WHITE);
    const pivot = (x, y, cls, inner, style = "") => `<g transform="translate(${x} ${y})"><g class="${cls}"${style}><g transform="translate(${-x} ${-y})">${inner}</g></g></g>`;
    const [motL, motR] = ARM_MOTION[pose] || ["swing", "swing"];
    const armMarkup = ARMS[pose].map((p, i) => {
      if (!p.length) return "";
      const d = armPath(p);
      const inner = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${WHITE}" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>`;
      return pivot(p[0], p[1], `gk-arm gk-arm-${i ? "R" : "L"} gk-am-${i ? motR : motL}`, inner, ` style="--dir:${i ? -1 : 1}"`);
    }).join("");
    const eyeG = (e, t, c) => pivot(c[0], c[1], `gk-eye gk-em-${EYE_MOTION[t] || "none"}`, `<g fill="${INK}">${ink(e[0])}</g>${e[1]}`);
    const mouthG = pivot(50, 67, `gk-mouth gk-mm-${MOUTH_MOTION[spec.mouth] || "none"}`, `<g fill="${INK}">${ink(m[0])}</g>${m[1]}`);
    const extras = (spec.extras || "").split(/\s+/).filter(Boolean).map(k => EXTRAS[k] ? `<g class="gk-x gk-x-${k}">${EXTRAS[k]().map(part => `<g>${part}</g>`).join("")}</g>` : "").join("");
    const t = [];
    if (spec.dy) t.push(`translate(0 ${spec.dy})`);
    if (spec.tilt) t.push(`rotate(${spec.tilt} 50 70)`);
    if (spec.squash) t.push(`translate(50 102) scale(${spec.squash[0]} ${spec.squash[1]}) translate(-50 -102)`);
    const size = opts.size ? ` width="${opts.size}" height="${opts.size}"` : "";
    const motion = opts.still ? "still" : (spec.motion || "bob");
    const dur = spec.d || 2;
    const content = (front ? "" : armMarkup) +
      `<path d="${BODY}" fill="${WHITE}" stroke="${INK}" stroke-width="3.4" stroke-linejoin="round"/>` +
      (front ? armMarkup : "") +
      eyeG(left, eL, EL) + eyeG(right, eR, ER) + mouthG + extras;
    return `<svg viewBox="-6 -14 112 124"${size} xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${opts.label || "Specaboo ghost"}" class="gk${opts.still ? " gk-still" : ""}" style="--d:${dur}s">` +
      `<g transform="${t.join(" ")}"${spec.fade ? ` opacity="${spec.fade}"` : ""}>` +
      pivot(50, 102, `gk-body gk-bm-${motion}`, content) + `</g></svg>`;
  }

  // ---- the animation stylesheet (inject once per page with GhostKit.css) ----
  const css = `
.gk g { transform-box: view-box; }
.gk-body, .gk-arm, .gk-eye, .gk-mouth { transform-origin: 0 0; animation-duration: var(--d); animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.gk-x > g { transform-box: fill-box; transform-origin: center; animation-duration: var(--d); animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.gk-x > g:nth-child(2) { animation-delay: calc(var(--d) * -.33); }
.gk-x > g:nth-child(3) { animation-delay: calc(var(--d) * -.66); }
.gk-x > g:nth-child(4) { animation-delay: calc(var(--d) * -.2); }
.gk-x > g:nth-child(5) { animation-delay: calc(var(--d) * -.5); }
.gk-x > g:nth-child(6) { animation-delay: calc(var(--d) * -.8); }

/* body */
.gk-bm-bob { animation-name: gk-bob; }

@keyframes gk-drip { 0% { transform: translateY(-2px); opacity: 0; } 20% { opacity: 1; } 80% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(10px); opacity: 0; } }
@keyframes gk-drift { 0%,100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
@keyframes gk-stream { 0%,100% { transform: scaleY(.85); } 50% { transform: scaleY(1.05); } }
@keyframes gk-glow { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes gk-popx { 0%,60%,100% { transform: scale(1) rotate(0); } 15% { transform: scale(1.3) rotate(-8deg); } 30% { transform: scale(.95) rotate(4deg); } 45% { transform: scale(1) rotate(0); } }
@keyframes gk-flicker { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
@keyframes gk-dot { 0%,60%,100% { opacity: .25; transform: translateY(0); } 20% { opacity: 1; transform: translateY(-2px); } }
@keyframes gk-fall { 0% { transform: translateY(-6px) rotate(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(12px) rotate(180deg); opacity: 0; } }
@keyframes gk-scribble { 0%,50%,100% { transform: rotate(0) translateX(0); } 25% { transform: rotate(-8deg) translateX(-1px); } 75% { transform: rotate(6deg) translateX(1px); } }
@keyframes gk-press { 0%,50%,100% { transform: translateY(0); } 25%,75% { transform: translateY(1px); } }
@keyframes gk-flame { 0%,100% { transform: scale(1,1); } 25% { transform: scale(.92,1.12); } 50% { transform: scale(1.05,.94); } 75% { transform: scale(.96,1.08); } }
@keyframes gk-halo { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes gk-tilt { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
@keyframes gk-split-l { 0%,100% { transform: translateX(0) rotate(0); } 50% { transform: translateX(-2px) rotate(-8deg); } }
@keyframes gk-split-r { 0%,100% { transform: translateX(0) rotate(0); } 50% { transform: translateX(2px) rotate(8deg); } }
@keyframes gk-glint { 0%,70%,100% { opacity: 1; } 80% { opacity: .75; } }

.gk-still *, .gk-paused * { animation-play-state: paused !important; }
.gk-still * { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .gk * { animation: none !important; } }
`;
  function injectCss() {
    if (typeof document === "undefined" || document.getElementById("gk-css")) return;
    const st = document.createElement("style"); st.id = "gk-css"; st.textContent = css; document.head.append(st);
  }
  return { svg, css, injectCss, ARMS: Object.keys(ARMS), EXTRAS: Object.keys(EXTRAS) };
})();
</script>
<script>
(() => {
  const KEY = "specaboo:text";
  const THEME_KEY = "specaboo:theme";
  const page = document.getElementById("page");
  const statusEl = document.getElementById("status");
  const countEl = document.getElementById("count");
  const ghost = document.getElementById("ghost");
  const toastEl = document.getElementById("toast");
  const themeBtn = document.getElementById("theme");
  const themeLabel = document.getElementById("themeLabel");
  const themeIcon = document.getElementById("themeIcon");
  const root = document.documentElement;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }
  };

  // ---------- toast ----------
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }
  // ---------- ghost moods ----------
  const MOODS = {
    idle:   { eyes: "open", mouth: "smile", arms: "down", motion: "bob", d: 2.4 },
    typing: { eyes: "lookD", mouth: "smile", arms: "typing", motion: "bob", d: 1 },
    saved:  { eyes: "happy", mouth: "grin", arms: "up", motion: "hop", d: 1.2 },
    boo:    { eyes: "open", mouth: "big", arms: "up", motion: "boo", d: 1.4 },
    proud:  { eyes: "happy", mouth: "big", arms: "flex", motion: "bounce", d: 1.2 },
    worried:{ eyes: "sad", mouth: "wavy", arms: "cheeks", motion: "tremble", d: 1.6 }
  };
  GhostKit.injectCss();
  let moodTimer, baseMood = "idle";
  function setMood(name, ms) {
    clearTimeout(moodTimer);
    ghost.innerHTML = GhostKit.svg(MOODS[name], { label: "Specaboo ghost" });
    if (ms) moodTimer = setTimeout(() => setMood(baseMood), ms);
  }
  function boo(mood = "boo") {
    setMood(mood, 1400);
    ghost.classList.remove("boo");
    void ghost.offsetWidth;
    ghost.classList.add("boo");
  }
  ghost.addEventListener("click", () => {
    boo();
    const lines = ["Boo!", "Keep going, it's looking good.", "Your words are safe with me.", "Still here. Still haunting."];
    toast(lines[Math.floor(Math.random() * lines.length)]);
  });

  // ---------- counting ----------
  function stats(text) {
    const words = (text.match(/[\p{L}\p{N}][\p{L}\p{N}'’\-]*/gu) || []).length;
    const chars = text.length;
    const minutes = Math.max(1, Math.round(words / 230));
    return { words, chars, minutes };
  }
  function renderCount() {
    const { words, chars, minutes } = stats(page.value);
    countEl.firstChild.nodeValue = `${words.toLocaleString()} ${words === 1 ? "word" : "words"}`;
    countEl.lastChild.textContent = words ? ` · ${chars.toLocaleString()} chars · ${minutes} min read` : "";
  }

  // ---------- autosave ----------
  let saveTimer, storageOk = true;
  function setStatus(text, warn = false) {
    statusEl.textContent = text;
    statusEl.classList.toggle("warn", warn);
  }
  function save() {
    clearTimeout(saveTimer);
    const ok = store.set(KEY, page.value);
    if (ok) {
      storageOk = true;
      const t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      setStatus(`Saved at ${t}`);
      baseMood = "idle";
      setMood("saved", 1200);
    } else {
      storageOk = false;
      setStatus("Can't save in this browser. Download to keep it.", true);
      baseMood = "worried"; setMood("worried");
    }
  }
  function updateTitle() {
    const first = page.value.split("\n").find(l => l.trim()) || "";
    document.title = first ? `${first.trim().slice(0, 40)} · Specaboo` : "Specaboo";
  }

  let typingTimer;
  page.addEventListener("input", () => {
    renderCount();
    updateTitle();
    if (storageOk) setStatus("Saving…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 500);
    document.body.classList.add("typing");
    if (baseMood !== "typing") { baseMood = "typing"; setMood("typing"); }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => document.body.classList.remove("typing"), 2500);
  });
  document.addEventListener("mousemove", () => document.body.classList.remove("typing"));
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

  // keep tabs open in other windows in sync
  window.addEventListener("storage", e => {
    if (e.key === KEY && e.newValue !== null && e.newValue !== page.value) {
      page.value = e.newValue; renderCount(); updateTitle(); setStatus("Updated from another tab");
    }
  });

  // ---------- theme ----------
  const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
  function currentTheme() {
    const t = root.getAttribute("data-theme");
    if (t === "dark" || t === "light") return t;
    return darkMQ.matches ? "dark" : "light";
  }
  const moon = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>';
  const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>';
  function renderThemeBtn() {
    const dark = currentTheme() === "dark";
    themeIcon.innerHTML = dark ? sun : moon;
    themeLabel.textContent = dark ? "Light" : "Dark";
    themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  const savedTheme = store.get(THEME_KEY);
  if (savedTheme === "dark" || savedTheme === "light") root.setAttribute("data-theme", savedTheme);
  themeBtn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store.set(THEME_KEY, next);
    renderThemeBtn();
    page.focus();
  });
  darkMQ.addEventListener?.("change", renderThemeBtn);
  new MutationObserver(renderThemeBtn).observe(root, { attributes: true, attributeFilter: ["data-theme"] });

  // ---------- download ----------
  // Inside a claude.ai artifact, files go through the viewer's download prompt.
  // As a normal website, a plain blob link does the job.
  const downloadsReady = (window.claude && typeof window.claude.use === "function")
    ? window.claude.use("downloads").catch(() => null)
    : Promise.resolve(null);
  const inArtifact = !!(window.claude && window.claude.use);

  function filename() {
    const first = (page.value.split("\n").find(l => l.trim()) || "specaboo").trim();
    const slug = first.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "").slice(0, 40);
    const d = new Date();
    const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    return `${slug || "specaboo"}-${date}.txt`;
  }
  async function copyFallback(msg) {
    try { await navigator.clipboard.writeText(page.value); toast(msg); }
    catch { page.focus(); page.select(); toast("Text selected. Press Ctrl+C (or ⌘C) to copy it."); }
  }
  async function download() {
    if (!page.value.trim()) { toast("Nothing to download yet. Type something first."); return; }
    const name = filename();
    if (inArtifact) {
      const dl = await downloadsReady;
      if (dl) {
        try { await dl.save({ filename: name, data: page.value }); boo("proud"); toast(`Saved ${name}`); }
        catch (e) {
          if (e && e.code === "declined") return;
          await copyFallback("Download isn't available here, so I copied your text instead.");
        }
        return;
      }
      await copyFallback("Download isn't available here, so I copied your text instead.");
      return;
    }
    const url = URL.createObjectURL(new Blob([page.value], { type: "text/plain;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    boo("proud");
    toast(`Downloaded ${name}`);
  }
  document.getElementById("download").addEventListener("click", download);


  // ---------- formatting popup ----------
  // Like WhatsApp: wrap the selection in *bold*, _italic_, ~strike~ or ```mono``` markers.
  // The text stays plain, so the .txt download keeps the markers.
  const fmt = document.getElementById("fmt");
  const fmtButtons = [...fmt.querySelectorAll("button")];
  const mirror = document.createElement("div");
  mirror.className = "mirror";
  document.body.appendChild(mirror);

  // Where in the window is character `index` of the textarea? (mirror-div trick)
  function caretXY(index) {
    const cs = getComputedStyle(page);
    for (const k of ["fontFamily", "fontSize", "fontWeight", "fontStyle", "lineHeight", "letterSpacing", "paddingTop", "paddingRight", "paddingBottom", "paddingLeft", "borderTopWidth", "borderLeftWidth", "boxSizing", "tabSize", "wordSpacing", "textIndent"]) mirror.style[k] = cs[k];
    mirror.style.width = page.clientWidth + "px";
    mirror.textContent = page.value.slice(0, index);
    const mark = document.createElement("span");
    mark.textContent = page.value.slice(index, index + 1) || ".";
    mirror.appendChild(mark);
    const r = page.getBoundingClientRect();
    const lh = parseFloat(cs.lineHeight) || 28;
    return { x: r.left + mark.offsetLeft - page.scrollLeft, y: r.top + mark.offsetTop - page.scrollTop, lh };
  }

  function wrapState(mark) {
    const { selectionStart: a, selectionEnd: b, value: v } = page;
    const n = mark.length, sel = v.slice(a, b);
    if (sel.length > 2 * n && sel.startsWith(mark) && sel.endsWith(mark)) return "inside";
    if (v.slice(a - n, a) === mark && v.slice(b, b + n) === mark) return "outside";
    return null;
  }

  function replaceRange(start, end, text) {
    page.focus();
    page.setSelectionRange(start, end);
    // execCommand keeps the browser's undo history; fall back if it's unavailable
    if (!document.execCommand || !document.execCommand("insertText", false, text)) {
      page.setRangeText(text, start, end, "end");
      page.dispatchEvent(new Event("input", { bubbles: true }));
    }
  }

  function toggle(mark) {
    const a = page.selectionStart, b = page.selectionEnd;
    if (a === b) return;
    const n = mark.length, v = page.value, state = wrapState(mark);
    if (state === "inside") {
      const inner = v.slice(a + n, b - n);
      replaceRange(a, b, inner);
      page.setSelectionRange(a, a + inner.length);
    } else if (state === "outside") {
      const inner = v.slice(a, b);
      replaceRange(a - n, b + n, inner);
      page.setSelectionRange(a - n, a - n + inner.length);
    } else {
      // keep spaces outside the markers, as WhatsApp does
      const sel = v.slice(a, b), lead = sel.match(/^\s*/)[0].length, trail = sel.match(/\s*$/)[0].length;
      const core = sel.slice(lead, sel.length - trail);
      if (!core) return;
      replaceRange(a + lead, b - trail, mark + core + mark);
      page.setSelectionRange(a + lead + n, a + lead + n + core.length);
    }
    showFmt();
  }

  function hideFmt() { fmt.hidden = true; }
  function showFmt() {
    const a = page.selectionStart, b = page.selectionEnd;
    if (a === b || document.activeElement !== page && !fmt.contains(document.activeElement)) return hideFmt();
    const start = caretXY(a), end = caretXY(Math.max(a, b - 1));
    const sameLine = Math.abs(start.y - end.y) < 2;
    let x = sameLine ? (start.x + end.x) / 2 + 6 : start.x + 24;
    let y = start.y - 10;
    fmt.hidden = false;
    const w = fmt.offsetWidth, h = fmt.offsetHeight;
    const below = y - h < 8;
    fmt.classList.toggle("below", below);
    if (below) y = (sameLine ? end.y : start.y) + start.lh + 8;
    x = Math.min(window.innerWidth - w / 2 - 8, Math.max(w / 2 + 8, x));
    fmt.style.left = x + "px";
    fmt.style.top = y + "px";
    fmtButtons.forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.mark ? !!wrapState(btn.dataset.mark) : lineState(btn.dataset.line))));
  }


  // ---------- headings and lists (Markdown-style line prefixes) ----------
  const RX = { h: /^(#{1,6}) /, ul: /^(\s*)([-*•]) /, ol: /^(\s*)(\d+)([.)]) / };
  function lineBounds() {
    const v = page.value, a = page.selectionStart;
    let b = page.selectionEnd;
    if (b > a && v[b - 1] === "\n") b--;
    const start = v.lastIndexOf("\n", a - 1) + 1;
    let end = v.indexOf("\n", b);
    if (end === -1) end = v.length;
    return [start, end];
  }
  const stripLine = l => l.replace(RX.h, "").replace(RX.ul, "$1").replace(RX.ol, "$1");
  function lineState(kind) {
    const [st, en] = lineBounds();
    const lines = page.value.slice(st, en).split("\n").filter(l => l.trim());
    if (!lines.length) return false;
    if (kind[0] === "h") { const lvl = +kind[1]; return lines.every(l => (l.match(RX.h) || [, ""])[1].length === lvl); }
    return lines.every(l => RX[kind].test(l));
  }
  function applyLine(kind) {
    const [st, en] = lineBounds();
    const on = lineState(kind);
    let n = 0;
    const out = page.value.slice(st, en).split("\n").map(l => {
      if (!l.trim()) return l;
      const bare = stripLine(l);
      if (on) return bare;
      const indent = bare.match(/^\s*/)[0], text = bare.slice(indent.length);
      if (kind[0] === "h") return "#".repeat(+kind[1]) + " " + bare.trim();
      if (kind === "ul") return indent + "- " + text;
      return indent + (++n) + ". " + text;
    }).join("\n");
    replaceRange(st, en, out);
    page.setSelectionRange(st, st + out.length);
    showFmt();
  }
  fmt.querySelectorAll("[data-line]").forEach(btn => btn.addEventListener("click", () => applyLine(btn.dataset.line)));

  // Renumber a numbered list block that contains position `pos`, keeping the caret in place.
  function renumberAround(pos) {
    const v = page.value;
    const lines = v.split("\n");
    let idx = v.slice(0, pos).split("\n").length - 1;
    const m0 = lines[idx] && lines[idx].match(RX.ol);
    if (!m0) return;
    const indent = m0[1];
    const same = l => { const m = l.match(RX.ol); return m && m[1] === indent; };
    let top = idx; while (top > 0 && same(lines[top - 1])) top--;
    let bot = idx; while (bot < lines.length - 1 && same(lines[bot + 1])) bot++;
    let start = 0; for (let i = 0; i < top; i++) start += lines[i].length + 1;
    const block = lines.slice(top, bot + 1);
    const first = +block[0].match(RX.ol)[2];
    const fixed = block.map((l, i) => l.replace(RX.ol, (_, ind, __, d) => `${ind}${first + i}${d} `));
    const oldText = block.join("\n"), newText = fixed.join("\n");
    if (oldText === newText) return;
    // keep the caret on the same character
    const lineIdx = idx - top, col = pos - (start + block.slice(0, lineIdx).reduce((s, l) => s + l.length + 1, 0));
    const shift = fixed[lineIdx].length - block[lineIdx].length;
    replaceRange(start, start + oldText.length, newText);
    const caret = start + fixed.slice(0, lineIdx).reduce((s, l) => s + l.length + 1, 0) + Math.max(0, col + shift);
    page.setSelectionRange(caret, caret);
  }

  // Enter continues a list, Enter on an empty item ends it, Tab / Shift+Tab indent list items.
  page.addEventListener("keydown", e => {
    if (e.isComposing || e.metaKey || e.ctrlKey || e.altKey) return;
    const v = page.value, a = page.selectionStart, b = page.selectionEnd;
    const ls = v.lastIndexOf("\n", a - 1) + 1;
    let le = v.indexOf("\n", a); if (le === -1) le = v.length;
    const line = v.slice(ls, le);
    const ul = line.match(RX.ul), ol = line.match(RX.ol);
    const m = ul || ol;
    if (e.key === "Enter" && !e.shiftKey && a === b && m) {
      const prefixLen = m[0].length;
      if (a < ls + prefixLen) return; // caret inside the marker: normal Enter
      e.preventDefault();
      if (!line.slice(prefixLen).trim()) { // empty item: end the list
        replaceRange(ls, le, m[1]);
        page.setSelectionRange(ls + m[1].length, ls + m[1].length);
        return;
      }
      const marker = ul ? `${ul[1]}${ul[2]} ` : `${ol[1]}${+ol[2] + 1}${ol[3]} `;
      replaceRange(a, a, "\n" + marker);
      const caret = a + 1 + marker.length;
      page.setSelectionRange(caret, caret);
      if (ol) renumberAround(caret);
      return;
    }
    if (e.key === "Tab" && m) {
      e.preventDefault();
      const [st, en] = lineBounds();
      const lines = v.slice(st, en).split("\n");
      const out = lines.map(l => (RX.ul.test(l) || RX.ol.test(l)) ? (e.shiftKey ? l.replace(/^ {1,2}/, "") : "  " + l) : l).join("\n");
      const delta = out.length - (en - st);
      replaceRange(st, en, out);
      if (a === b) { const c = Math.max(st, a + (lines.length === 1 ? delta : 0)); page.setSelectionRange(c, c); }
      else page.setSelectionRange(st, st + out.length);
    }
  });

  fmt.addEventListener("mousedown", e => e.preventDefault()); // keep the selection while clicking
  fmtButtons.forEach(btn => btn.dataset.mark && btn.addEventListener("click", () => toggle(btn.dataset.mark)));
  page.addEventListener("mouseup", () => setTimeout(showFmt, 0));
  page.addEventListener("keyup", e => { if (e.shiftKey || e.key === "Shift" || (e.key.toLowerCase() === "a" && (e.metaKey || e.ctrlKey))) showFmt(); });
  page.addEventListener("select", showFmt);
  document.addEventListener("selectionchange", () => { if (document.activeElement === page && page.selectionStart === page.selectionEnd) hideFmt(); });
  page.addEventListener("input", () => { if (page.selectionStart === page.selectionEnd) hideFmt(); });
  page.addEventListener("scroll", () => { if (!fmt.hidden) showFmt(); });
  page.addEventListener("blur", () => setTimeout(() => { if (!fmt.contains(document.activeElement)) hideFmt(); }, 0));
  window.addEventListener("resize", () => { if (!fmt.hidden) showFmt(); });
  page.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey) {
      if (e.altKey && /^Digit[123]$/.test(e.code)) { e.preventDefault(); applyLine("h" + e.code.slice(-1)); return; }
      if (e.shiftKey && e.code === "Digit8") { e.preventDefault(); applyLine("ul"); return; }
      if (e.shiftKey && e.code === "Digit7") { e.preventDefault(); applyLine("ol"); return; }
    }
    if (!(e.metaKey || e.ctrlKey) || page.selectionStart === page.selectionEnd) {
      if (e.key === "Escape") hideFmt();
      return;
    }
    const k = e.key.toLowerCase();
    const mark = !e.shiftKey && k === "b" ? "*" : !e.shiftKey && k === "i" ? "_" : e.shiftKey && k === "x" ? "~" : e.shiftKey && k === "m" ? "```" : null;
    if (mark) { e.preventDefault(); toggle(mark); }
  });

  // Ctrl/⌘+S downloads instead of the browser's "save page" dialog
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); download(); }
  });

  // ---------- boot ----------
  const saved = store.get(KEY);
  if (saved) {
    page.value = saved;
    setStatus("Welcome back, your page is here");
  }
  if (store.set("specaboo:probe", "1") === false) {
    storageOk = false;
    setStatus("Can't save in this browser. Download to keep it.", true);
  }
  setMood(baseMood);
  renderCount();
  updateTitle();
  renderThemeBtn();
  page.focus();
  page.setSelectionRange(page.value.length, page.value.length);
})();
</script>
